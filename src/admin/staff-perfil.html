<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOTELIFE Staff — Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1a222d; --bg-outer: #f9f6f0; --gold: #d4b285; --bronze:#8b6534;
    --border-light: #e5e1d8; --text-muted: rgba(26,34,45,0.6); --red: #b5573a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:"Manrope",-apple-system,sans-serif; background:#e5e2db; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; color:var(--navy); }
  .phone{ background:var(--bg-outer); border:0.8px solid var(--gold); border-radius:44px; box-shadow:0 25px 50px -12px rgba(26,34,45,0.25); width:100%; max-width:390px; overflow:hidden; display:flex; flex-direction:column; height:844px; position:relative; }
  .status-bar{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; height:44px; padding:0 24px; font-weight:600; font-size:14px; }
  .status-icons{ display:flex; gap:6px; align-items:center; font-size:12px; }

  .header{ flex-shrink:0; background:var(--navy); padding:14px 20px 18px; color:#fff; display:flex; align-items:center; gap:12px; }
  .back-btn{ width:36px; height:36px; border-radius:10px; background: rgba(255,255,255,0.08); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; text-decoration:none; flex-shrink:0; }
  .header-title{ font-family:"Cormorant Garamond", serif; font-weight:700; font-size:22px; }

  .scroll-content{ flex:1; overflow-y:auto; scrollbar-width:none; padding:16px 20px 24px; display:flex; flex-direction:column; gap:16px; }
  .scroll-content::-webkit-scrollbar{ display:none; }

  .hero{ background:#fff; border:1px solid var(--border-light); border-radius:20px; padding:22px 20px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .avatar{ width:64px; height:64px; border-radius:20px; background:var(--gold); color:var(--navy); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; }
  .hero-name{ font-family:"Cormorant Garamond", serif; font-weight:700; font-size:22px; text-align:center; }
  .hero-sub{ font-size:11px; color:var(--text-muted); }
  .area-pill{ margin-top:2px; background:rgba(212,178,133,0.15); border:1px solid var(--gold); border-radius:10px; padding:5px 12px; font-weight:700; font-size:11px; color:var(--bronze); }

  .section-title{ font-weight:700; font-size:11px; text-transform:uppercase; color:var(--text-muted); }
  .card{ background:#fff; border:1px solid var(--border-light); border-radius:16px; overflow:hidden; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border-light); }
  .row:last-child{ border-bottom:none; }
  .row-label{ font-size:11px; color:var(--text-muted); flex-shrink:0; }
  .row-value{ font-size:12.5px; font-weight:600; text-align:right; }
  .card-text{ padding:14px 16px; font-size:12px; line-height:1.5; }

  .toggle-row{ padding:12px 16px; }
  .toggle-label{ font-size:12.5px; font-weight:600; }
  .toggle{ width:42px; height:24px; border-radius:12px; background:var(--border-light); position:relative; cursor:pointer; transition:background .2s; flex-shrink:0; }
  .toggle.on{ background:var(--gold); }
  .toggle-knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:10px; background:#fff; transition:left .2s; }
  .toggle.on .toggle-knob{ left:20px; }

  .logout-btn{ background:#fff; border:1px solid var(--red); border-radius:16px; padding:14px; font-family:inherit; font-weight:700; font-size:12px; color:var(--red); cursor:pointer; text-transform:uppercase; }
  .logout-btn:hover{ background:rgba(181,87,58,0.06); }

  .bottom-nav{ flex-shrink:0; background:var(--navy); border-top:1px solid var(--gold); height:70px; display:flex; align-items:center; justify-content:space-around; }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; color:#fff; opacity:0.6; font-size:9px; cursor:pointer; background:none; border:none; font-family:inherit; text-decoration:none; }
  .nav-item.active{ color:var(--gold); opacity:1; font-weight:700; }
  .nav-icon{ font-size:16px; }
</style>
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<script>
  // Exigir sesión de staff iniciada
  (function() {
    if (!JSON.parse(localStorage.getItem('hotelife_staff_session') || 'null')) {
      window.location.href = 'login.html';
    }
  })();
</script>

<div class="phone">
  <div class="status-bar"><span>12:40</span><span class="status-icons">📶 📡 🔋</span></div>

  <div class="header">
    <a class="back-btn" id="backBtn" href="login.html" aria-label="Volver">←</a>
    <p class="header-title">Perfil</p>
  </div>

  <div class="scroll-content">
    <div class="hero">
      <div class="avatar" id="avatar"></div>
      <p class="hero-name" id="heroName"></p>
      <p class="hero-sub">HOTELIFE · Turno activo</p>
      <span class="area-pill" id="areaPill"></span>
    </div>

    <div>
      <p class="section-title" style="margin-bottom:10px;">Datos de la cuenta</p>
      <div class="card">
        <div class="row"><span class="row-label">Correo corporativo</span><span class="row-value" id="emailValue"></span></div>
        <div class="row"><span class="row-label">Área</span><span class="row-value" id="areaValue"></span></div>
        <div class="row"><span class="row-label">Turno</span><span class="row-value">Mañana · 6:00 AM – 2:00 PM</span></div>
        <div class="row"><span class="row-label">Teléfono</span><span class="row-value">+57 300 000 0000</span></div>
      </div>
    </div>

    <div>
      <p class="section-title" style="margin-bottom:10px;">Áreas que atiende</p>
      <div class="card"><p class="card-text" id="atiende"></p></div>
    </div>

    <div>
      <p class="section-title" style="margin-bottom:10px;">Preferencias</p>
      <div class="card">
        <div class="row toggle-row"><span class="toggle-label">Avisar de nuevas solicitudes</span><div class="toggle on" data-pref="avisos"><div class="toggle-knob"></div></div></div>
        <div class="row toggle-row"><span class="toggle-label">Sonido en solicitudes urgentes</span><div class="toggle on" data-pref="sonido"><div class="toggle-knob"></div></div></div>
      </div>
    </div>

    <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
  </div>

  <nav class="bottom-nav" id="staffNav" data-active="perfil"></nav>
</div>

<script>
  // Datos por área (el área viene en ?area=..., o de la sesión si falta)
  const AREAS = {
    mantenimiento: {
      initials: 'JM', name: 'Jefe de Mantenimiento', area: '🔧 Mantenimiento', email: 'mantenimiento@hotelife.com',
      atiende: 'Aire acondicionado, plomería, eléctrico, TV / WiFi, puertas / cerraduras y muebles.',
      home: 'staff-mantenimiento.html'
    },
    amadellaves: {
      initials: 'AL', name: 'Jefa de Ama de Llaves', area: '🧺 Ama de Llaves', email: 'amadellaves@hotelife.com',
      atiende: 'Housekeeping, lavandería y planchado, minibar y amenities adicionales.',
      home: 'staff-amadellaves.html',
    },
    ayb: {
      initials: 'AB', name: 'Jefe de Alimentos y Bebidas', area: '🍽️ Alimentos y Bebidas', email: 'ayb@hotelife.com',
      atiende: 'Room service, bar / lounge, desayuno y restaurante.',
      home: 'staff-ayb.html',
    },
    spa: {
      initials: 'SW', name: 'Jefe de Spa & Wellness', area: '🧖‍♀️ Spa & Wellness', email: 'spa@hotelife.com',
      atiende: 'Spa, gimnasio, piscina, sauna / jacuzzi y clases (yoga, pilates).',
      home: 'staff-spa.html',
    },
    conserjeria: {
      initials: 'CJ', name: 'Jefe de Conserjería', area: '🧭 Conserjería', email: 'conserjeria@hotelife.com',
      atiende: 'Traslados, alquiler de vehículos, tours, reserva de entradas y niñera / kids club.',
      home: 'staff-conserjeria.html',
    }
  };

  const session = JSON.parse(localStorage.getItem('hotelife_staff_session') || 'null');
  const params = new URLSearchParams(window.location.search);
  let key = params.get('area');
  if (!AREAS[key]) key = session && AREAS[session.role] ? session.role : 'mantenimiento';
  const A = AREAS[key];

  document.getElementById('avatar').textContent = A.initials;
  document.getElementById('heroName').textContent = A.name;
  document.getElementById('areaPill').textContent = A.area;
  document.getElementById('areaValue').textContent = A.area;
  document.getElementById('atiende').textContent = A.atiende;
  // Si la sesión es de esta misma área, mostrar el correo con el que se inició sesión
  document.getElementById('emailValue').textContent = (session && session.role === key && session.email) ? session.email : A.email;

  // El "←" y la primera pestaña regresan a la app del área
  document.getElementById('backBtn').href = A.home;


  // Preferencias (se recuerdan en este navegador)
  const prefs = JSON.parse(localStorage.getItem('hotelife_staff_prefs') || '{"avisos":true,"sonido":true}');
  document.querySelectorAll('.toggle').forEach(t => {
    t.classList.toggle('on', !!prefs[t.dataset.pref]);
    t.addEventListener('click', () => {
      t.classList.toggle('on');
      prefs[t.dataset.pref] = t.classList.contains('on');
      localStorage.setItem('hotelife_staff_prefs', JSON.stringify(prefs));
    });
  });

  // Cerrar sesión: borra la sesión simulada y vuelve al login
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('hotelife_staff_session');
    window.location.href = 'login.html';
  });
</script>
<script>document.getElementById("staffNav").dataset.area = key;</script>
<script src="staff-nav.js"></script>

</body>
</html>
