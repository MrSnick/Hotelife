<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOTELIFE Staff — Equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#1a222d; --bg-outer:#f9f6f0; --gold:#d4b285; --bronze:#8b6534; --border-light:#e5e1d8; --text-muted:rgba(26,34,45,0.6); --green:#4c8c4a; --red:#b5573a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:"Manrope",-apple-system,sans-serif; background:#e5e2db; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; color:var(--navy); }
  .phone{ background:var(--bg-outer); border:0.8px solid var(--gold); border-radius:44px; box-shadow:0 25px 50px -12px rgba(26,34,45,0.25); width:100%; max-width:390px; overflow:hidden; display:flex; flex-direction:column; height:844px; position:relative; }
  .status-bar{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; height:44px; padding:0 24px; font-weight:600; font-size:14px; }
  .header{ flex-shrink:0; background:var(--navy); padding:14px 20px 18px; color:#fff; display:flex; align-items:center; gap:12px; }
  .back-btn{ width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,0.08); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; text-decoration:none; flex-shrink:0; }
  .header-title{ font-family:"Cormorant Garamond",serif; font-weight:700; font-size:22px; }
  .header-sub{ font-size:10px; color:var(--gold); }
  .scroll-content{ flex:1; overflow-y:auto; scrollbar-width:none; padding:16px 20px 24px; display:flex; flex-direction:column; gap:12px; }
  .scroll-content::-webkit-scrollbar{ display:none; }
  .section-title{ font-weight:700; font-size:11px; text-transform:uppercase; color:var(--text-muted); }
  .bottom-nav{ flex-shrink:0; background:var(--navy); border-top:1px solid var(--gold); height:70px; display:flex; align-items:center; justify-content:space-around; }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; color:#fff; opacity:0.6; font-size:9px; cursor:pointer; background:none; border:none; }
  .nav-item.active{ color:var(--gold); opacity:1; }
  .nav-icon{ font-size:16px; }
  .card{ background:#fff; border:1px solid var(--border-light); border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .av{ width:38px; height:38px; border-radius:12px; background:var(--gold); color:var(--navy); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .who{ flex:1; min-width:0; } .who b{ display:block; font-size:13px; } .who span{ font-size:11px; color:var(--text-muted); }
  .chip{ border:none; border-radius:10px; padding:6px 10px; font-family:inherit; font-size:10px; font-weight:700; text-transform:uppercase; cursor:pointer; }
  .st-disp{ background:rgba(76,140,74,0.15); color:var(--green); }
  .st-ocup{ background:rgba(212,178,133,0.3); color:var(--bronze); }
  .st-desc{ background:rgba(26,34,45,0.08); color:var(--text-muted); }
  .req{ background:#fff; border:1px solid var(--border-light); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .req b{ font-size:12.5px; } .req span{ font-size:11px; color:var(--text-muted); }
  .req select{ height:36px; border:1px solid var(--gold); border-radius:10px; padding:0 10px; font-family:inherit; font-size:11.5px; background:#fff; color:var(--navy); }
  .note{ font-size:11px; color:var(--text-muted); }
</style>
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<script>
  if (!JSON.parse(localStorage.getItem('hotelife_staff_session') || 'null')) window.location.href = 'login.html';
</script>
<div class="phone">
  <div class="status-bar"><span>12:40</span><span>📶 📡 🔋</span></div>
  <div class="header">
    <a class="back-btn" id="backBtn" href="login.html" aria-label="Volver">←</a>
    <div><p class="header-title">Equipo</p><p class="header-sub" id="areaSub"></p></div>
  </div>
  <div class="scroll-content">
    <p class="section-title">Disponibilidad del equipo</p>
    <div id="team" style="display:flex;flex-direction:column;gap:10px;"></div>
    <p class="section-title" style="margin-top:6px;">Solicitudes por asignar</p>
    <div id="unassigned" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>
  <nav class="bottom-nav" id="staffNav" data-active="equipo"></nav>
</div>
<script src="staff-nav.js"></script>
<script>
  const AREA = staffAreaFromUrl();
  const A = STAFF_AREAS[AREA];
  document.getElementById('areaSub').textContent = A.label;
  document.getElementById('backBtn').href = A.home;
  const TEAM_KEY = 'hotelife_staff_team'; // { area: { "Nombre": "disp|ocup|desc" } }
  const ST = { disp: ['Disponible', 'st-disp'], ocup: ['Ocupado', 'st-ocup'], desc: ['Descanso', 'st-desc'] };
  const ORDER = ['disp', 'ocup', 'desc'];
  const loadTeam = () => JSON.parse(localStorage.getItem(TEAM_KEY) || '{}');
  const reqs = () => JSON.parse(localStorage.getItem('hotelife_service_requests') || '[]');
  const mine = () => reqs().filter(r => r.dept && r.dept.includes(A.dept));

  function renderTeam() {
    const team = (loadTeam()[AREA]) || {};
    const rs = mine();
    document.getElementById('team').innerHTML = A.team.map(n => {
      const s = team[n] || 'disp';
      const count = rs.filter(r => r.assignedTo === n && r.status !== 'completada').length;
      const ini = n.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      return `<div class="card"><div class="av">${ini}</div><div class="who"><b>${n.replace(/ \(.*/, '')}</b><span>${(n.match(/\((.*)\)/) || [, ''])[1]} · ${count} asignada${count === 1 ? '' : 's'}</span></div><button class="chip ${ST[s][1]}" data-n="${n}">${ST[s][0]}</button></div>`;
    }).join('');
    document.querySelectorAll('#team .chip').forEach(b => b.addEventListener('click', () => {
      const all = loadTeam(); const t = all[AREA] || {}; const cur = t[b.dataset.n] || 'disp';
      t[b.dataset.n] = ORDER[(ORDER.indexOf(cur) + 1) % 3]; all[AREA] = t;
      localStorage.setItem(TEAM_KEY, JSON.stringify(all)); renderTeam(); renderUnassigned();
    }));
  }
  function renderUnassigned() {
    const team = (loadTeam()[AREA]) || {};
    const avail = A.team.filter(n => (team[n] || 'disp') !== 'desc');
    const list = mine().filter(r => !r.assignedTo && r.status !== 'completada');
    const box = document.getElementById('unassigned');
    if (!list.length) { box.innerHTML = '<p class="note">No hay solicitudes pendientes de asignar. Las nuevas de huéspedes aparecerán aquí.</p>'; return; }
    box.innerHTML = list.map(r => `<div class="req"><b>${r.title} · Hab. ${r.room}</b><span>${r.guestName || ''}</span>
      <select data-id="${r.id}"><option value="">Asignar a…</option>${avail.map(n => `<option>${n}</option>`).join('')}</select></div>`).join('');
    box.querySelectorAll('select').forEach(s => s.addEventListener('change', () => {
      if (!s.value) return;
      const all = reqs(); const r = all.find(x => x.id === s.dataset.id); if (!r) return;
      r.assignedTo = s.value; localStorage.setItem('hotelife_service_requests', JSON.stringify(all));
      const all2 = loadTeam(); const t = all2[AREA] || {}; t[s.value] = 'ocup'; all2[AREA] = t; localStorage.setItem(TEAM_KEY, JSON.stringify(all2));
      renderTeam(); renderUnassigned();
    }));
  }
  renderTeam(); renderUnassigned();
  setInterval(renderUnassigned, 4000);
</script>
</body>
</html>
