<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOTELIFE — Pasarela de pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1a222d;
    --bg-outer: #f9f6f0;
    --gold: #d4b285;
    --border-light: #e0e0e0;
    --muted: #8c8c8c;
    --text-dark: #4a4a4a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family: "Manrope", -apple-system, sans-serif;
    background: #e5e2db;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    color: var(--navy);
  }
  .phone{
    background: var(--bg-outer);
    border: 0.8px solid var(--gold);
    border-radius: 40px;
    box-shadow: 0 25px 50px -12px rgba(26,34,45,0.3);
    width: 100%;
    max-width: 390px;
    overflow: hidden;
    display:flex;
    flex-direction:column;
    height: 844px;
  }
  .header{
    flex-shrink:0;
    background: var(--bg-outer);
    border-bottom: 0.8px solid var(--border-light);
    display:flex; align-items:center; justify-content:space-between;
    height:78px; padding: 12px 18px 0;
  }
  .back-btn{
    background:none; border:none; font-weight:700; font-size:13px;
    color: var(--navy); cursor:pointer;
  }
  .title{ font-weight:700; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; }
  .room-badge{
    background: var(--navy); border-radius:12px; padding:4px 10px;
    font-weight:700; font-size:10px; color: var(--gold);
  }

  .content{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    display:flex; flex-direction:column; gap:14px;
    padding: 16px 18px 24px;
  }
  .content::-webkit-scrollbar{ display:none; }

  .section-label{ font-weight:700; font-size:10px; letter-spacing:1px; text-transform:uppercase; color: var(--gold); }
  .box{
    background:#fff; border:0.8px solid var(--border-light); border-radius:16px;
    padding:12px 14px; display:flex; flex-direction:column; gap:6px;
  }
  .row{ display:flex; justify-content:space-between; font-size:12px; }
  .row .label{ color: var(--text-dark); font-weight:300; }
  .row .value{ font-weight:700; color: var(--navy); }
  .divider{ height:1px; background: var(--border-light); margin:2px 0; }
  .total-row{ display:flex; justify-content:space-between; align-items:baseline; padding-top:2px; }
  .total-row .label{ font-weight:700; font-size:13px; }
  .total-row .value{ font-weight:700; font-size:15px; }

  .payment-option{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 12px; border-radius:12px;
    border: 0.8px solid var(--border-light);
    cursor:pointer;
  }
  .payment-option.selected{ background: #faf6f0; border-color: var(--gold); }
  .option-info{ display:flex; gap:10px; align-items:center; }
  .gateway-logo{
    width:26px; height:26px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:11px; color:#fff; flex-shrink:0;
  }
  .option-title{ font-weight:700; font-size:12px; }
  .option-subtitle{ font-weight:300; font-size:10px; color: var(--muted); }
  .radio{
    width:14px; height:14px; border-radius:7px; border:1.6px solid var(--muted);
    flex-shrink:0; position:relative;
  }
  .radio.selected{ border-color: var(--gold); }
  .radio.selected::after{
    content:''; position:absolute; inset:1.6px; border-radius:7px; background: var(--navy);
  }

  .footer-area{
    flex-shrink:0; background: var(--bg-outer); border-top: 0.8px solid var(--border-light);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding: 10px 18px 20px;
  }
  .pay-btn{
    width:100%; height:44px; border-radius:22px;
    background: var(--navy); border:0.8px solid var(--gold);
    box-shadow: 0 4px 6px rgba(26,34,45,0.2);
    font-weight:700; font-size:12px; color: var(--gold);
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <button class="back-btn" id="backBtn">⬅️ Volver</button>
    <p class="title">Pasarela de pago</p>
    <span class="room-badge">Suite 405</span>
  </div>

  <div class="content">
    <div>
      <p class="section-label">RESUMEN DE LA CUENTA</p>
      <div class="box" style="margin-top:6px;">
        <div class="row"><span class="label">Consumos y servicios</span><span class="value">$137.500</span></div>
        <div class="row"><span class="label">Impuestos</span><span class="value">$20.625</span></div>
        <div class="divider"></div>
        <div class="total-row"><span class="label">Total a pagar</span><span class="value">$158.125 COP</span></div>
      </div>
    </div>

    <div>
      <p class="section-label">MÉTODO DE PAGO</p>
      <div class="box" style="margin-top:6px; gap:8px;" id="paymentOptions">
        <div class="payment-option selected" data-method="wompi" data-amount="$158.125">
          <div class="option-info">
            <div class="gateway-logo" style="background:#3852ff;">W</div>
            <div>
              <p class="option-title">Wompi</p>
              <p class="option-subtitle">PSE • Bancolombia • Nequi</p>
            </div>
          </div>
          <div class="radio selected"></div>
        </div>
        <div class="payment-option" data-method="mercadopago" data-amount="$158.125">
          <div class="option-info">
            <div class="gateway-logo" style="background:#009ee3;">MP</div>
            <div>
              <p class="option-title">Mercado Pago</p>
              <p class="option-subtitle">PSE • Dinero en cuenta • Tarjetas</p>
            </div>
          </div>
          <div class="radio"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-area">
    <button class="pay-btn" id="payBtn">🔒 Pagar con Wompi ($158.125)</button>
  </div>
</div>

<script>
  document.getElementById('backBtn').addEventListener('click', () => {
    console.log('Volviendo a Mi cuenta');
  });

  const payBtn = document.getElementById('payBtn');
  document.querySelectorAll('.payment-option').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.payment-option').forEach(o => {
        o.classList.remove('selected');
        o.querySelector('.radio').classList.remove('selected');
      });
      opt.classList.add('selected');
      opt.querySelector('.radio').classList.add('selected');
      const name = opt.querySelector('.option-title').textContent;
      payBtn.textContent = `🔒 Pagar con ${name} (${opt.dataset.amount})`;
    });
  });

  payBtn.addEventListener('click', () => {
    const selected = document.querySelector('.payment-option.selected').querySelector('.option-title').textContent;
    console.log('Redirigiendo a pago QR con:', selected);
  });
</script>

</body>
</html>
