<title>HOTELIFE — Restaurante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1a222d; --bg-outer: #f9f6f0; --gold: #d4b285; --border-light: #e5e1d8;
    --text-muted: rgba(26,34,45,0.6);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:"Manrope",-apple-system,sans-serif; background:#e5e2db; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; color:var(--navy); }
  .phone{ background:var(--bg-outer); border:0.8px solid var(--gold); border-radius:44px; box-shadow:0 25px 50px -12px rgba(26,34,45,0.25); width:100%; max-width:390px; overflow:hidden; display:flex; flex-direction:column; height:844px; position:relative; }
  .status-bar{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; height:44px; padding:0 24px; font-weight:600; font-size:14px; }
  .status-icons{ display:flex; gap:6px; align-items:center; font-size:12px; }
  .header{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:12px; height:64px; padding:0 20px; border-bottom:1px solid var(--gold); }
  .header-left{ display:flex; align-items:center; gap:10px; }
  .back-btn{ width:40px; height:40px; border-radius:20px; background:#fff; border:1px solid var(--border-light); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; flex-shrink:0; }
  .back-btn svg{ width:14px; height:14px; color:var(--navy); }
  .header-title{ font-family:"Cormorant Garamond", serif; font-weight:700; font-size:18px; }
  .room-badge{ background: var(--navy); border-radius:12px; padding:4px 10px; font-weight:700; font-size:10px; color: var(--gold); white-space:nowrap; }

  .scroll-content{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding: 16px 20px 110px; display:flex; flex-direction:column; gap:18px; }
  .scroll-content::-webkit-scrollbar{ display:none; }

  /* Hero */
  .hero{ border-radius:20px; padding:20px; color:#fff; display:flex; flex-direction:column; gap:8px; background: linear-gradient(135deg, #2a2016, #1a222d); }
  .hero-label{ color:var(--gold); font-weight:800; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; }
  .hero-title{ font-family:"Cormorant Garamond", serif; font-weight:700; font-size:24px; }
  .hero-desc{ font-size:12px; color:rgba(255,255,255,0.75); line-height:1.4; }
  .hero-cta{ margin-top:6px; align-self:flex-start; background:var(--gold); color:var(--navy); border:none; border-radius:12px; padding:10px 16px; font-weight:800; font-size:11.5px; text-transform:uppercase; cursor:pointer; }

  /* Delivery selector */
  .delivery-selector{ display:flex; gap:8px; background:#fff; border:1px solid var(--border-light); border-radius:14px; padding:4px; }
  .delivery-opt{ flex:1; text-align:center; padding:9px 6px; border-radius:11px; font-size:11.5px; font-weight:700; color:var(--text-muted); cursor:pointer; }
  .delivery-opt.active{ background:var(--navy); color:#fff; }

  /* Category chips */
  .category-chips{ display:flex; flex-shrink:0; align-items:flex-start; gap:8px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; padding-bottom:2px; }
  .category-chips::-webkit-scrollbar{ display:none; }
  .chip{ flex-shrink:0; padding:9px 16px; border-radius:16px; border:1px solid var(--border-light); background:#fff; font-size:12px; font-weight:700; color:var(--text-muted); cursor:pointer; white-space:nowrap; }
  .chip.active{ background:var(--navy); border-color:var(--navy); color:#fff; }

  /* Section title */
  .section-title{ font-weight:800; font-size:11px; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.3px; }

  /* Chef carousel (hub) */
  .chef-carousel{ display:flex; flex-shrink:0; align-items:flex-start; gap:12px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; margin:0 -20px; padding:0 20px 4px; }
  .chef-carousel::-webkit-scrollbar{ display:none; }
  .chef-card{ flex:0 0 150px; background:#fff; border:1px solid var(--border-light); border-radius:16px; overflow:hidden; cursor:pointer; }
  .chef-card-photo{ width:100%; height:100px; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-size:34px; }
  .chef-card-body{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; }
  .chef-card-name{ font-weight:700; font-size:12px; line-height:1.25; }
  .chef-card-price{ font-size:11px; color:var(--text-muted); font-weight:600; }
  .chef-card-add{ margin-top:2px; height:28px; border-radius:9px; background:var(--gold); border:none; font-weight:700; font-size:10.5px; color:var(--navy); cursor:pointer; }

  /* Explore rows (hub) */
  .explore-row{ display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border-light); border-radius:16px; padding:10px; cursor:pointer; }
  .explore-photo{ width:52px; height:52px; border-radius:12px; flex-shrink:0; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .explore-info{ flex:1; min-width:0; }
  .explore-title{ font-weight:700; font-size:13px; }
  .explore-desc{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .explore-chevron{ color:var(--gold); flex-shrink:0; }
  .explore-chevron svg{ width:12px; height:16px; }

  /* Dish list (category views) */
  .dish-item{ display:flex; gap:12px; background:#fff; border:1px solid var(--border-light); border-radius:16px; padding:14px; }
  .dish-photo{ width:52px; height:52px; border-radius:12px; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  .dish-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .dish-name{ font-weight:700; font-size:13.5px; }
  .dish-desc{ font-size:11.5px; color:var(--text-muted); line-height:1.4; }
  .dish-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .dish-price{ font-weight:700; font-size:13px; }
  .qty-control{ display:flex; align-items:center; gap:10px; }
  .qty-btn{ width:26px; height:26px; border-radius:8px; border:1px solid var(--border-light); background:#fff; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .qty-value{ font-weight:700; font-size:13px; min-width:14px; text-align:center; }
  .add-btn{ height:30px; padding:0 14px; border-radius:9px; background:var(--gold); border:none; font-weight:700; font-size:11px; color:var(--navy); cursor:pointer; }

  .cart-bar{
    position:absolute; left:20px; right:20px; bottom:24px;
    background:var(--navy); border-radius:18px; padding:14px 18px;
    display:none; align-items:center; justify-content:space-between;
    box-shadow:0 12px 24px rgba(26,34,45,0.3); cursor:pointer;
  }
  .cart-bar.visible{ display:flex; }
  .cart-info{ color:#fff; }
  .cart-count{ font-size:11px; opacity:0.7; }
  .cart-total{ font-family:"Cormorant Garamond", serif; font-weight:700; font-size:18px; }
  .cart-cta{ background:var(--gold); color:var(--navy); font-weight:800; font-size:12px; text-transform:uppercase; padding:10px 16px; border-radius:12px; border:none; cursor:pointer; }

  /* Modal de confirmación */
  .modal-overlay{ position:absolute; inset:0; background:rgba(26,34,45,0.5); display:none; align-items:flex-end; z-index:30; }
  .modal-overlay.open{ display:flex; }
  .modal-panel{ width:100%; max-height:80%; background:#fff; border-radius:24px 24px 0 0; display:flex; flex-direction:column; overflow:hidden; }
  .modal-header{ padding:18px 20px; border-bottom:1px solid var(--border-light); display:flex; align-items:center; justify-content:space-between; }
  .modal-title{ font-weight:700; font-size:15px; }
  .modal-close{ background:none; border:none; font-size:16px; color:var(--text-muted); cursor:pointer; }
  .modal-body{ flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
  .cart-line{ display:flex; justify-content:space-between; font-size:13px; }
  .cart-line b{ font-weight:700; }
  .notes-box{ width:100%; height:60px; border:1px solid var(--border-light); border-radius:12px; padding:10px; font-family:inherit; font-size:12px; resize:none; outline:none; margin-top:4px; }
  .notes-box:focus{ border-color:var(--gold); }
  .modal-total-row{ display:flex; justify-content:space-between; font-weight:700; font-size:15px; padding-top:10px; border-top:1px solid var(--border-light); margin-top:6px; }
  .modal-footer{ padding:16px 20px 20px; border-top:1px solid var(--border-light); }
  .confirm-btn{ width:100%; height:50px; border-radius:16px; background:var(--gold); border:none; font-weight:700; font-size:13px; text-transform:uppercase; color:var(--navy); cursor:pointer; }
  .confirm-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* Overlay: elegir dónde recibir el pedido */
  .location-option{ display:flex; align-items:center; gap:12px; border:1px solid var(--border-light); border-radius:14px; padding:14px; cursor:pointer; }
  .location-option.selected{ border-color:var(--gold); border-width:1.5px; background:rgba(212,178,133,0.08); }
  .location-emoji{ width:40px; height:40px; border-radius:12px; background:var(--bg-outer); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .location-name{ font-weight:700; font-size:13px; }
  .location-check{ margin-left:auto; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--border-light); display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; flex-shrink:0; }
  .location-option.selected .location-check{ background:var(--gold); border-color:var(--gold); }

  .success-screen{
    position:absolute; inset:0; background:var(--bg-outer);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:40px; text-align:center; z-index:40;
  }
  .success-screen.visible{ display:flex; }
  .success-icon{ width:64px; height:64px; border-radius:32px; background:var(--navy); border:1.6px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--gold); }
  .success-title{ font-family:"Cormorant Garamond", serif; font-weight:700; font-size:20px; }
  .success-desc{ font-size:12.5px; color:var(--text-muted); line-height:1.5; }
  .success-btn{ margin-top:10px; height:46px; padding:0 24px; border-radius:16px; background:var(--navy); border:none; font-weight:700; font-size:12px; color:var(--gold); cursor:pointer; }

  .bottom-nav{ flex-shrink:0; background: var(--bg-outer); border-top: 1px solid var(--gold); height:70px; display:flex; align-items:center; justify-content:space-around; }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; color: var(--navy); font-size:9px; text-decoration:none; cursor:pointer; background:none; border:none; }
  .nav-item.active{ color: var(--gold); }
  .nav-icon{ display:flex; }
  .nav-icon svg{ width:16px; height:16px; }

  .chat-fab{ position:absolute; right:20px; bottom:98px; width:52px; height:52px; border-radius:26px; background:var(--gold); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 16px rgba(26,34,45,0.2); cursor:pointer; }
  .chat-fab svg{ width:22px; height:22px; color:var(--navy); }
</style>

    { key:'restaurante', title:'Restaurante', desc:'Almuerzo y cena de autor', emoji:'🍷' },
    { key:'bar', title:'Bar / Lounge', desc:'Coctelería y bebidas', emoji:'🍸' },
    { key:'roomservice', title:'Room service', desc:'Directo a tu suite, 24/7', emoji:'🛎️', external:'room-service.html' }
  ];

  const HUB_HERO = { heroLabel:'RESTAURANTE PRINCIPAL', heroTitle:'Sabores de autor', heroDesc:'Desayuno, almuerzo, cena y bar · Pide a tu suite o reserva mesa' };

  function money(n) { return '$' + n.toLocaleString('es-CO') + ' COP'; }
  function mediaStyle(item) {
    return item.img ? `background-image:url('${item.img}')` : '';
  }

  // ---------- Estado ----------
  let activeChip = 'todo';
  let deliveryMode = 'suite';
  const cart = {}; // { itemId: { name, price, qty } }
  const ALL_ITEMS = {};
  Object.values(CATEGORIES).forEach(cat => cat.groups.forEach(g => g.items.forEach(it => { ALL_ITEMS[it.id] = it; })));

  function render() {
    const root = document.getElementById('scrollContent');
    if (activeChip === 'todo') {
      root.innerHTML = heroHtml(HUB_HERO, true) + deliverySelectorHtml() + chipsHtml() + `
        <p class="section-title">Recomendados del chef</p>
        <div class="chef-carousel">${CHEF_RECOMMENDATIONS.map(chefCardHtml).join('')}</div>
        <p class="section-title">Explora por momento</p>
        <div style="display:flex; flex-direction:column; gap:10px;">${EXPLORE_ROWS.map(exploreRowHtml).join('')}</div>
      `;
    } else {
      const cat = CATEGORIES[activeChip];
      root.innerHTML = heroHtml(cat, false) + deliverySelectorHtml() + chipsHtml() +
        cat.groups.map(g => `<p class="section-title">${g.title}</p>` + g.items.map(dishItemHtml).join('')).join('');
    }
    wireInteractions();
  }

  function heroHtml(h, withCta) {
    return `<div class="hero">
      <p class="hero-label">${h.heroLabel}</p>
      <p class="hero-title">${h.heroTitle}</p>
      <p class="hero-desc">${h.heroDesc}</p>
      ${withCta ? `<button class="hero-cta" id="reservarMesaBtn">Reservar mesa →</button>` : ''}
    </div>`;
  }
  function deliverySelectorHtml() {
    return `<div class="delivery-selector">
      <div class="delivery-opt ${deliveryMode === 'suite' ? 'active' : ''}" data-mode="suite">🛎️ A mi suite 405</div>
      <div class="delivery-opt ${deliveryMode === 'restaurante' ? 'active' : ''}" data-mode="restaurante">🍽️ En el restaurante</div>
    </div>`;
  }
  function chipsHtml() {
    const chips = [['todo','Todo'],['desayuno','Desayuno'],['restaurante','Restaurante'],['bar','Bar'],['roomservice','Room service']];
    return `<div class="category-chips">${chips.map(([key,label]) =>
      `<button class="chip ${activeChip === key ? 'active' : ''}" data-chip="${key}">${label}</button>`
    ).join('')}</div>`;
  }
  function chefCardHtml(item) {
    return `<div class="chef-card" data-goto="${item.goto}">
      <div class="chef-card-photo" style="${mediaStyle(item)}">${item.img ? '' : item.emoji}</div>
      <div class="chef-card-body">
        <p class="chef-card-name">${item.name}</p>
        <p class="chef-card-price">${money(item.price)}</p>
        <button class="chef-card-add" data-add="${item.id}">+ Añadir</button>
      </div>
    </div>`;
  }
  function exploreRowHtml(row) {
    return `<div class="explore-row" data-explore="${row.key}" ${row.external ? `data-external="${row.external}"` : ''}>
      <div class="explore-photo" style="${row.img ? `background-image:url('${row.img}')` : ''}">${row.img ? '' : row.emoji}</div>
      <div class="explore-info"><p class="explore-title">${row.title}</p><p class="explore-desc">${row.desc}</p></div>
      <span class="explore-chevron"><svg viewBox="0 0 17 22" fill="none"><path d="M6.375 6.0415L11.3333 10.9998L6.375 15.9582" stroke="currentColor" stroke-width="1.16875" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>`;
  }
  function dishItemHtml(item) {
    return `<div class="dish-item" data-id="${item.id}">
      <div class="dish-photo" style="${mediaStyle(item)}">${item.img ? '' : item.emoji}</div>
      <div class="dish-info">
        <p class="dish-name">${item.name}</p>
        <p class="dish-desc">${item.desc}</p>
        <div class="dish-bottom">
          <p class="dish-price">${money(item.price)}</p>
          <div class="qty-control-wrap" data-qty-for="${item.id}"></div>
        </div>
      </div>
    </div>`;
  }

  function qtyControlHtml(id) {
    const qty = cart[id]?.qty || 0;
    if (qty === 0) return `<button class="add-btn" data-action="add" data-id="${id}">+ Agregar</button>`;
    return `<div class="qty-control"><button class="qty-btn" data-action="minus" data-id="${id}">−</button><span class="qty-value">${qty}</span><button class="qty-btn" data-action="plus" data-id="${id}">+</button></div>`;
  }
  function renderQtyControls() {
    document.querySelectorAll('[data-qty-for]').forEach(el => { el.innerHTML = qtyControlHtml(el.dataset.qtyFor); });
  }

  function updateCartBar() {
    const items = Object.values(cart);
    const count = items.reduce((s, i) => s + i.qty, 0);
    const total = items.reduce((s, i) => s + i.qty * i.price, 0);
    document.getElementById('cartCount').textContent = count + (count === 1 ? ' item' : ' items');
    document.getElementById('cartTotalMini').textContent = '$' + total.toLocaleString('es-CO');
    document.getElementById('cartBar').classList.toggle('visible', count > 0);
  }

  function addItem(id) {
    const item = ALL_ITEMS[id];
    if (!item) return;
    cart[id] = { name: item.name, price: item.price, qty: (cart[id]?.qty || 0) + 1 };
    renderQtyControls();
    updateCartBar();
  }
  function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    renderQtyControls();
    updateCartBar();
  }

  function wireInteractions() {
    renderQtyControls();

    document.getElementById('reservarMesaBtn')?.addEventListener('click', () => { activeChip = 'restaurante'; render(); });

    document.querySelectorAll('.delivery-opt').forEach(opt => {
      opt.addEventListener('click', () => { deliveryMode = opt.dataset.mode; render(); });
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const key = chip.dataset.chip;
        if (key === 'roomservice') { window.location.href = 'room-service.html'; return; }
        activeChip = key;
        render();
      });
    });

    document.querySelectorAll('.chef-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-add]')) return;
        activeChip = card.dataset.goto;
        render();
      });
    });
    document.querySelectorAll('[data-add]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); addItem(btn.dataset.add); });
    });

    document.querySelectorAll('.explore-row').forEach(row => {
      row.addEventListener('click', () => {
        if (row.dataset.external) { window.location.href = row.dataset.external; return; }
        activeChip = row.dataset.explore;
        render();
      });
    });

    document.querySelectorAll('[data-action="add"]').forEach(btn => btn.addEventListener('click', () => addItem(btn.dataset.id)));
    document.querySelectorAll('[data-action="minus"]').forEach(btn => btn.addEventListener('click', () => changeQty(btn.dataset.id, -1)));
    document.querySelectorAll('[data-action="plus"]').forEach(btn => btn.addEventListener('click', () => changeQty(btn.dataset.id, 1)));
  }

  render();

  // ---------- Carrito / confirmación / ubicación de entrega ----------
  const cartModal = document.getElementById('cartModal');
  document.getElementById('viewCartBtn').addEventListener('click', () => {
    const lines = Object.values(cart);
    const container = document.getElementById('cartLines');
    const notesBox = document.getElementById('notesInput');
    container.innerHTML = '';
    lines.forEach(l => {
      const row = document.createElement('div');
      row.className = 'cart-line';
      row.innerHTML = `<span>${l.qty}x ${l.name}</span><b>$${(l.qty * l.price).toLocaleString('es-CO')}</b>`;
      container.appendChild(row);
    });
    container.appendChild(notesBox);
    const totalRow = document.createElement('div');
    totalRow.className = 'modal-total-row';
    const total = lines.reduce((s, i) => s + i.qty * i.price, 0);
    totalRow.innerHTML = `<span>Total</span><span id="modalTotal">$${total.toLocaleString('es-CO')}</span>`;
    container.appendChild(totalRow);
    cartModal.classList.add('open');
  });
  document.getElementById('closeModalBtn').addEventListener('click', () => cartModal.classList.remove('open'));
  cartModal.addEventListener('click', (e) => { if (e.target === cartModal) cartModal.classList.remove('open'); });

  const LOCATIONS = [
    { id: 'habitacion', icon: '🛏️', name: 'Habitación' },
    { id: 'terraza', icon: '🌴', name: 'Terraza' },
    { id: 'lobby', icon: '🛋️', name: 'Lobby' },
    { id: 'piscina', icon: '🏊', name: 'Piscina' }
  ];
  let selectedLocation = LOCATIONS[0].id;
  let pendingNotes = '';
  const locationModal = document.getElementById('locationModal');

  function renderLocationOptions() {
    const box = document.getElementById('locationOptions');
    box.innerHTML = LOCATIONS.map(loc => `
      <div class="location-option ${loc.id === selectedLocation ? 'selected' : ''}" data-location="${loc.id}">
        <div class="location-emoji">${loc.icon}</div>
        <p class="location-name">${loc.name}</p>
        <span class="location-check">${loc.id === selectedLocation ? '✓' : ''}</span>
      </div>
    `).join('');
    box.querySelectorAll('.location-option').forEach(opt => {
      opt.addEventListener('click', () => { selectedLocation = opt.dataset.location; renderLocationOptions(); });
    });
  }

  document.getElementById('confirmOrderBtn').addEventListener('click', () => {
    const lines = Object.values(cart);
    if (lines.length === 0) return;
    pendingNotes = document.getElementById('notesInput').value.trim();
    cartModal.classList.remove('open');
    // Si el huésped eligió "En el restaurante", nos saltamos la elección de ubicación (ya está en el restaurante)
    if (deliveryMode === 'restaurante') {
      finalizeOrder('En el restaurante');
      return;
    }
    renderLocationOptions();
    locationModal.classList.add('open');
  });
  document.getElementById('closeLocationModalBtn').addEventListener('click', () => locationModal.classList.remove('open'));
  locationModal.addEventListener('click', (e) => { if (e.target === locationModal) locationModal.classList.remove('open'); });
  document.getElementById('confirmLocationBtn').addEventListener('click', () => {
    const locationName = LOCATIONS.find(l => l.id === selectedLocation).name;
    locationModal.classList.remove('open');
    finalizeOrder(locationName);
  });

  function finalizeOrder(deliverTo) {
    const lines = Object.values(cart);
    if (lines.length === 0) return;
    const total = lines.reduce((s, i) => s + i.qty * i.price, 0);

    const order = {
      id: 'ORD-' + Date.now(),
      room: '405',
      guest: 'Sr Snick',
      roomType: 'Suite Deluxe',
      source: '🍽️ Restaurante',
      deliverTo,
      items: lines.map(l => `${l.qty}x ${l.name}`).join('\n') + `\nEntregar en: ${deliverTo}` + (pendingNotes ? `\nNota: ${pendingNotes}` : ''),
      total: '$' + total.toLocaleString('es-CO'),
      stage: 'nuevo',
      createdAt: new Date().toISOString()
    };
    const existing = JSON.parse(localStorage.getItem('hotelife_shared_orders') || '[]');
    existing.unshift(order);
    localStorage.setItem('hotelife_shared_orders', JSON.stringify(existing));

    document.getElementById('successScreen').classList.add('visible');
  }

  document.getElementById('successBackBtn').addEventListener('click', () => { window.location.href = 'servicios.html'; });
  document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'servicios.html'; });
  document.getElementById('chatFab').addEventListener('click', () => { window.location.href = 'solicitudes.html'; });
</script>

<script src="js/nav.js"></script>
</body>
</html>
