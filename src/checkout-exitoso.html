<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOTELIFE — Check-out exitoso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1a222d;
    --bg-outer: #f9f6f0;
    --gold: #d4b285;
    --border-light: #e0e0e0;
    --muted: #8c8c8c;
    --text-dark: #4a4a4a;
    --green: #2e7d32;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family: "Manrope", -apple-system, sans-serif;
    background: #e5e2db;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    color: var(--navy);
  }
  .phone{
    background: var(--bg-outer);
    border: 0.8px solid var(--gold);
    border-radius: 40px;
    box-shadow: 0 25px 50px -12px rgba(26,34,45,0.3);
    width: 100%;
    max-width: 390px;
    overflow: hidden;
    display:flex;
    flex-direction:column;
    height: 844px;
  }
  .header{
    flex-shrink:0;
    background: var(--bg-outer);
    border-bottom: 0.8px solid var(--border-light);
    display:flex; align-items:center; justify-content:center;
    height:73px; padding-top:12px;
  }
  .title{ font-weight:700; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; }

  .content{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding: 20px 18px;
  }
  .content::-webkit-scrollbar{ display:none; }

  .success-icon{
    width:64px; height:64px; border-radius:32px;
    background: var(--navy); border:1.6px solid var(--gold);
    box-shadow: 0 4px 6px rgba(26,34,45,0.15);
    display:flex; align-items:center; justify-content:center;
    font-size:28px; color: var(--gold);
  }
  .success-title{ font-weight:700; font-size:18px; text-align:center; }
  .success-desc{ font-weight:400; font-size:11px; color: var(--muted); text-align:center; line-height:1.4; }

  .rating-card{
    background:#fff; border:0.8px solid var(--border-light); border-radius:20px;
    padding:16px; width:100%; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .rating-label{ font-weight:700; font-size:11px; letter-spacing:1px; text-transform:uppercase; color: var(--gold); align-self:flex-start; }
  .stars{ display:flex; gap:8px; }
  .star{ font-size:24px; color: var(--gold); cursor:pointer; opacity:0.4; }
  .star.filled{ opacity:1; }
  .comment-input{
    width:100%; height:70px; border-radius:10px;
    background:#faf9f6; border:0.8px solid var(--border-light);
    padding:8px 10px; font-family:inherit; font-size:11px; font-weight:300;
    color: var(--text-dark); resize:none; outline:none;
  }
  .comment-input:focus{ border-color: var(--gold); }

  .details-box{
    background:#fff; border:0.8px solid var(--border-light); border-radius:16px;
    padding:12px 14px; width:100%; display:flex; flex-direction:column; gap:6px;
  }
  .row{ display:flex; justify-content:space-between; font-size:11px; }
  .row .label{ color: var(--text-dark); font-weight:300; }
  .row .value{ font-weight:700; color: var(--navy); }
  .row .value.paid{ color: var(--green); }

  .footer-area{
    flex-shrink:0; background: var(--bg-outer); border-top: 0.8px solid var(--border-light);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding: 10px 18px 20px;
  }
  .action-btn{
    width:100%; height:44px; border-radius:22px;
    background: var(--navy); border:0.8px solid var(--gold);
    box-shadow: 0 4px 6px rgba(26,34,45,0.2);
    font-weight:700; font-size:12px; color: var(--gold);
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <p class="title">Estancia finalizada</p>
  </div>

  <div class="content">
    <div class="success-icon">✓</div>
    <p class="success-title">¡Check-out exitoso!</p>
    <p class="success-desc">Gracias por hospedarte en HOTELIFE. Tu cuenta para la Suite 405 ha sido liquidada correctamente.</p>

    <div class="rating-card">
      <p class="rating-label">¿Cómo fue tu experiencia?</p>
      <div class="stars" id="stars">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>
      <textarea class="comment-input" id="commentInput" placeholder="Déjanos un comentario o sugerencia sobre tu estancia..."></textarea>
    </div>

    <div class="details-box">
      <div class="row"><span class="label">Habitación</span><span class="value">Suite 405</span></div>
      <div class="row"><span class="label">Factura final</span><span class="value">#INV-2026-8801</span></div>
      <div class="row"><span class="label">Estado de la cuenta</span><span class="value paid">PAGADO ($0 pendiente)</span></div>
    </div>
  </div>

  <div class="footer-area">
    <button class="action-btn" id="finishBtn">Enviar reseña y finalizar</button>
  </div>
</div>

<script>
  let selectedRating = 5;
  const stars = document.querySelectorAll('.star');
  function paintStars(value) {
    stars.forEach(s => s.classList.toggle('filled', Number(s.dataset.value) <= value));
  }
  paintStars(selectedRating);
  stars.forEach(star => {
    star.addEventListener('click', () => {
      selectedRating = Number(star.dataset.value);
      paintStars(selectedRating);
    });
  });

  document.getElementById('finishBtn').addEventListener('click', () => {
    const comment = document.getElementById('commentInput').value;
    console.log('Reseña enviada:', { rating: selectedRating, comment });
    console.log('Finalizando sesión del huésped, volviendo a la pantalla de login');
  });
</script>

</body>
</html>
